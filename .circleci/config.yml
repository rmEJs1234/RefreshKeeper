version: 2.1
jobs:
  build:
    docker:
      - image: cimg/android:2024.11
    steps:
      - checkout
      - run:
          name: Install SDK 35
          command: |
            (yes | sdkmanager --licenses > /dev/null) || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run:
          name: Build debug APK
          command: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk
workflows:
  build:
    jobs:
      - build
